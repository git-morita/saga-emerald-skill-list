<!DOCTYPE html>
<html class="staticrypt-html" lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>閃き帳</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#06100e" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="閃き帳" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" href="icon-192.png" />
        <link rel="apple-touch-icon" href="icon-192.png" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #4CAF50;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #4CAF50;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #76B852;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            /* SaGa-style override */
            .staticrypt-content{background:radial-gradient(120% 60% at 50% -10%,#154a3c 0%,transparent 60%),#06100e!important;color:#efe6cf;
              font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif!important;min-height:100%}
            .staticrypt-body{background:#06100e}
            .staticrypt-page{width:100%;max-width:400px;padding:18vh 16px 0}
            .staticrypt-form{background:linear-gradient(180deg,#163a31,#0a1e19);border:1px solid #d6b46a;border-radius:6px;padding:28px 22px;
              box-shadow:inset 0 0 0 3px #0a1e19,inset 0 0 0 4px rgba(214,180,106,.45),0 6px 18px rgba(0,0,0,.45)}
            .staticrypt-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;letter-spacing:.14em;color:#d6b46a;margin:0}
            .staticrypt-instructions{margin:0 0 4px}
            .staticrypt-instructions p{color:#a8b3a2;font-size:13px}
            .staticrypt-hr{border-top:1px solid rgba(214,180,106,.35);margin:14px 0}
            .staticrypt-password-container{background:rgba(4,12,10,.7);border:1px solid #8a7444;border-radius:4px}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{color:#efe6cf}
            .staticrypt-toggle-password-visibility{filter:invert(1)}
            .staticrypt-form .staticrypt-decrypt-button{background:linear-gradient(180deg,#2a7a62,#1d6b55);border:1px solid #46d3a3;border-radius:4px;
              font-weight:700;letter-spacing:.2em;font-size:15px}
            label.staticrypt-remember{color:#efe6cf;font-size:14px}
            .staticrypt-spinner{border-color:#d6b46a;border-right-color:transparent}
        </style>
    </head>
